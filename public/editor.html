<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Editor – CVCraft</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Merriweather:wght@400;700&family=Open+Sans:wght@400;600;700&family=Poppins:wght@400;600;700&family=Lato:wght@400;700&family=Playfair+Display:wght@500;700&family=Source+Sans+3:wght@400;600;700&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/app.css">
  <link rel="stylesheet" href="css/templates.css">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="/dashboard" title="Back to your CVs" style="text-decoration:none;color:inherit"><span class="logo">CV</span><b>CVCraft</b></a>
    <div class="doc-title"><input id="cvTitle" maxlength="80" aria-label="CV name" placeholder="Untitled CV"><span id="saveState" class="save-state" role="status"></span></div>
    <div class="region-pill" title="More regions coming soon">
      <label for="regionSel">Region</label>
      <select id="regionSel"></select>
    </div>
    <div class="top-actions">
      <button class="btn ghost" data-action="sample">Fill sample data</button>
      <button class="btn ghost" data-action="open-file">Open file</button>
      <button class="btn ghost" data-action="save-file">Save file</button>
      <button class="btn ghost" data-action="reset">Start over</button>
      <a class="btn ghost" href="/dashboard" style="text-decoration:none">My CVs</a>
      <input type="file" id="openInput" accept=".json,application/json" hidden>
      <button class="btn mobile-only" id="viewToggle" data-action="toggleView">Preview</button>
    </div>
  </header>

  <div class="shell">
    <aside class="panel">
      <nav id="steps" class="steps"></nav>
      <div id="form" class="form"></div>
      <div class="nav-btns">
        <button class="btn ghost" data-action="prev" id="btnPrev">← Back</button>
        <button class="btn primary" data-action="next" id="btnNext">Next →</button>
      </div>
    </aside>

    <section class="preview">
      <div class="pv-bar">
        <span class="pv-actions">
          <span id="pageInfo" class="page-info"></span>
          <button class="health-badge" id="healthBadge" data-action="health">CV health</button>
          <button class="btn small" data-action="guide">Format guide</button>
        </span>
        <span class="dl-quick">
          <button class="btn small" data-action="dl-jpg">JPG</button>
          <button class="btn small" data-action="dl-pdf">PDF</button>
          <button class="btn small" data-action="dl-docx">Word</button>
        </span>
      </div>
      <div id="pvScroll" class="pv-scroll">
        <div id="pageBox" class="page-box"><div id="pageScale" class="page-scale"></div></div>
      </div>
    </section>
  </div>

  <div id="modal" class="modal" hidden>
    <div class="modal-card">
      <h3>Unlock PDF &amp; Word downloads</h3>
      <p>Premium gives you a text-based <b>PDF</b> (ATS-friendly), an editable <b>Word</b> file and a watermark-free JPG.</p>
      <p class="price" id="priceLabel"></p>
      <div class="modal-actions">
        <button class="btn primary" data-action="buy">Buy premium</button>
        <button class="btn ghost" data-action="demo-unlock" id="demoBtn">Unlock (demo / testing)</button>
        <button class="btn ghost" data-action="close-modal">Not now</button>
      </div>
      <p class="fine">Free plan: JPG download with a small watermark.</p>
    </div>
  </div>

  <div id="infoModal" class="modal info-modal" hidden>
    <div class="modal-card" id="infoBody"></div>
  </div>

  <div id="toast" class="toast" hidden></div>

  <script src="vendor/html2canvas.min.js"></script>
  <script src="vendor/docx.min.js"></script>
  <script src="js/config.js"></script>
  <script src="js/editor-boot.js"></script>
</body>
</html>
