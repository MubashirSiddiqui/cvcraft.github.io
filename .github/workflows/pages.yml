# Deploys ONLY the static landing page (public/) to GitHub Pages.
# GitHub Pages cannot run the Node server, so login, dashboard and the editor
# will not work there. Host the full app on Render/Railway/Fly (see README).
name: Deploy landing page to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Point sign-in links at the live app (optional)
        # Set a repository variable APP_URL (Settings > Secrets and variables > Actions > Variables),
        # e.g. https://cvcraft.onrender.com  (no trailing slash). Without it, the buttons won't lead anywhere.
        env:
          APP_URL: ${{ vars.APP_URL }}
        run: |
          if [ -n "$APP_URL" ]; then
            sed -i "s#href=\"/login\"#href=\"$APP_URL/login\"#g; s#href=\"/dashboard\"#href=\"$APP_URL/dashboard\"#g" public/index.html
          fi
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
